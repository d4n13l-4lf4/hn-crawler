name: Acceptance Tests

on:
  workflow_call:
    inputs:
      ref:
        description: Git commit SHA containing acceptance tests
        required: true
        type: string
      beta-version:
        description: Exact published beta package version
        required: true
        type: string

permissions:
  contents: read

jobs:
  acceptance-tests:
    name: Run acceptance tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - name: Checkout acceptance test files
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            package.json
            package-lock.json
            tests/acceptance
            tsconfig.json

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure global npm PATH
        run: |
          NPM_GLOBAL_BIN="$(npm prefix -g)/bin"
          echo "$NPM_GLOBAL_BIN" >> "$GITHUB_PATH"
          echo "Global npm binaries: $NPM_GLOBAL_BIN"

      - name: Install dependencies
        run: npm ci

      - name: Install exact published beta version
        env:
          BETA_VERSION: ${{ inputs.beta-version }}
        run: |
          npm install --global "@d4n13l-4lf4/hn-crawler@$BETA_VERSION"

      - name: Verify CLI installation
        run: |
          which hn-crawler
          hn-crawler --help

      - name: Validate acceptance URL configuration
        env:
          HN_CRAWLER_WEB_PAGE_BASE_URL: ${{ vars.HN_CRAWLER_WEB_PAGE_BASE_URL }}
        run: |
          if [ -z "$HN_CRAWLER_WEB_PAGE_BASE_URL" ]; then
            echo "::error::Repository Actions variable HN_CRAWLER_WEB_PAGE_BASE_URL must be set to a deterministic crawl page URL."
            exit 1
          fi

      - name: Configure temporary usage database path
        run: |
          DB_DIRECTORY="${RUNNER_TEMP}/hn-crawler-usage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          mkdir -p "$DB_DIRECTORY"
          echo "HN_CRAWLER_DB_PATH=${DB_DIRECTORY}/usage.sqlite" >> "$GITHUB_ENV"

      - name: Run acceptance tests
        run: npm run test:acceptance
        env:
          HN_CRAWLER_WEB_PAGE_BASE_URL: ${{ vars.HN_CRAWLER_WEB_PAGE_BASE_URL }}
