<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="hn-crawler: a little spider crawling a list of news entries" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161f"/>
      <stop offset="1" stop-color="#22150e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6600" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="930" cy="125" r="130" fill="url(#glow)"/>

  <!-- Left: wordmark -->
  <text x="60" y="140" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="74" font-weight="700" fill="#ffffff"><tspan fill="#ff6600">hn-</tspan>crawler</text>
  <text x="62" y="200" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="24" fill="#8b93a7"><tspan fill="#ff6600">$</tspan> npx hn-crawler crawl --limit 30</text>
  <text x="62" y="250" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="22" fill="#c9cfdd">Crawl. Filter. Rank. Audit.</text>

  <!-- Right: list of entries -->
  <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">
    <rect x="710" y="175" width="440" height="26" rx="6" fill="#262b3a"/>
    <rect x="718" y="181" width="14" height="14" rx="3" fill="#ff6600"/>
    <rect x="744" y="184" width="250" height="8" rx="4" fill="#4a5168"/>
    <rect x="1030" y="184" width="100" height="8" rx="4" fill="#394058"/>

    <rect x="710" y="208" width="440" height="26" rx="6" fill="#262b3a" stroke="#ff6600" stroke-width="1.5"/>
    <rect x="718" y="214" width="14" height="14" rx="3" fill="#ff6600"/>
    <rect x="744" y="217" width="310" height="8" rx="4" fill="#6a728a"/>
    <rect x="1070" y="217" width="60" height="8" rx="4" fill="#ff6600"/>

    <rect x="710" y="241" width="440" height="26" rx="6" fill="#262b3a"/>
    <rect x="718" y="247" width="14" height="14" rx="3" fill="#ff6600" fill-opacity="0.7"/>
    <rect x="744" y="250" width="200" height="8" rx="4" fill="#4a5168"/>
    <rect x="1030" y="250" width="100" height="8" rx="4" fill="#394058"/>

    <rect x="710" y="274" width="440" height="26" rx="6" fill="#262b3a"/>
    <rect x="718" y="280" width="14" height="14" rx="3" fill="#ff6600" fill-opacity="0.5"/>
    <rect x="744" y="283" width="280" height="8" rx="4" fill="#4a5168"/>
    <rect x="1030" y="283" width="100" height="8" rx="4" fill="#394058"/>
  </g>

  <!-- Spider on a thread -->
  <line x1="930" y1="0" x2="930" y2="92" stroke="#8b93a7" stroke-width="2" stroke-dasharray="4 3"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- left legs -->
    <polyline points="920,110 888,88 866,104"/>
    <polyline points="918,118 880,110 856,130"/>
    <polyline points="918,126 882,134 864,158"/>
    <polyline points="922,133 894,156 884,180"/>
    <!-- right legs -->
    <polyline points="940,110 972,88 994,104"/>
    <polyline points="942,118 980,110 1004,130"/>
    <polyline points="942,126 978,134 996,158"/>
    <polyline points="938,133 966,156 976,180"/>
  </g>
  <ellipse cx="930" cy="125" rx="17" ry="22" fill="#ff6600"/>
  <circle cx="930" cy="98" r="11" fill="#ff8a3d"/>
  <circle cx="926" cy="95" r="2.6" fill="#14161f"/>
  <circle cx="934" cy="95" r="2.6" fill="#14161f"/>
  <path d="M922 120 L938 120 M923 129 L937 129" stroke="#14161f" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
