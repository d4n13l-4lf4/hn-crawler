<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="hn-crawler: crawl, filter, rank and inspect Hacker News entries from the command line" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161f"/>
      <stop offset="1" stop-color="#22150e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6600" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="900" cy="160" r="230" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(0,-20)">
    <polygon points="115,59 163.5,87 163.5,143 115,171 66.5,143 66.5,87" fill="#1d2130" stroke="#ff6600" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="115" y1="62" x2="115" y2="98" stroke="#8b93a7" stroke-width="2" stroke-dasharray="3 2.5"/>
    <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="109,110 92,98 80,108"/>
      <polyline points="108,116 88,118 78,132"/>
      <polyline points="108,123 90,134 86,150"/>
      <polyline points="111,130 100,144 98,154"/>
      <polyline points="121,110 138,98 150,108"/>
      <polyline points="122,116 142,118 152,132"/>
      <polyline points="122,123 140,134 144,150"/>
      <polyline points="119,130 130,144 132,154"/>
    </g>
    <ellipse cx="115" cy="121" rx="10" ry="14" fill="#ff6600"/>
    <circle cx="115" cy="103" r="7.5" fill="#ff8a3d"/>
    <circle cx="112" cy="101" r="1.8" fill="#14161f"/>
    <circle cx="118" cy="101" r="1.8" fill="#14161f"/>
    <path d="M109.5 117 L120.5 117 M110.5 124 L119.5 124" stroke="#14161f" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Wordmark, flags and install line -->
  <g font-family="'SFMono-Regular', Menlo, Consolas, monospace">
    <text x="195" y="115" font-size="64" font-weight="700" fill="#ffffff"><tspan fill="#ff6600">hn-</tspan>crawler</text>
    <text x="197" y="158" font-size="22" fill="#c9cfdd">Crawl. Filter. Rank. Inspect.</text>
    <rect x="60" y="222" width="141" height="34" rx="8" fill="#262b3a" stroke="#ff6600" stroke-opacity="0.6"/>
    <text x="130.5" y="244" text-anchor="middle" font-size="15" fill="#ffb27a">--title-words</text>
    <rect x="215" y="222" width="132" height="34" rx="8" fill="#262b3a" stroke="#ff6600" stroke-opacity="0.6"/>
    <text x="281.0" y="244" text-anchor="middle" font-size="15" fill="#ffb27a">--top-points</text>
    <rect x="361" y="222" width="150" height="34" rx="8" fill="#262b3a" stroke="#ff6600" stroke-opacity="0.6"/>
    <text x="436.0" y="244" text-anchor="middle" font-size="15" fill="#ffb27a">--top-comments</text>
    <text x="62" y="294" font-size="16" fill="#8b93a7"><tspan fill="#ff6600">$</tspan> npm i -g @d4n13l-4lf4/hn-crawler</text>
  </g>

  <!-- Terminal card -->
  <rect x="620" y="36" width="540" height="248" rx="12" fill="#0d0f16" stroke="#2f3547" stroke-width="1.5"/>
  <path d="M620 48 a12 12 0 0 1 12 -12 h516 a12 12 0 0 1 12 12 v22 h-540 z" fill="#1b1f2c"/>
  <circle cx="644" cy="53" r="5.5" fill="#ff5f56"/>
  <circle cx="664" cy="53" r="5.5" fill="#ffbd2e"/>
  <circle cx="684" cy="53" r="5.5" fill="#27c93f"/>
  <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">
    <text x="640" y="98" fill="#c9cfdd"><tspan fill="#ff6600">$</tspan> hn-crawler crawl --title-words gt:5 --top-comments</text>
    <text x="640" y="126" fill="#8b93a7">[</text>
    <text x="640" y="150" fill="#8b93a7" xml:space="preserve">  { <tspan fill="#7fb0ff">"rank"</tspan>: <tspan fill="#ff8a3d">5</tspan>,  <tspan fill="#7fb0ff">"points"</tspan>: <tspan fill="#ff8a3d">198</tspan>, <tspan fill="#7fb0ff">"number_of_comments"</tspan>: <tspan fill="#ff8a3d">262</tspan> },</text>
    <text x="640" y="174" fill="#8b93a7" xml:space="preserve">  { <tspan fill="#7fb0ff">"rank"</tspan>: <tspan fill="#ff8a3d">1</tspan>,  <tspan fill="#7fb0ff">"points"</tspan>: <tspan fill="#ff8a3d">412</tspan>, <tspan fill="#7fb0ff">"number_of_comments"</tspan>: <tspan fill="#ff8a3d">138</tspan> },</text>
    <text x="640" y="198" fill="#8b93a7" xml:space="preserve">  { <tspan fill="#7fb0ff">"rank"</tspan>: <tspan fill="#ff8a3d">4</tspan>,  <tspan fill="#7fb0ff">"points"</tspan>: <tspan fill="#ff8a3d">276</tspan>, <tspan fill="#7fb0ff">"number_of_comments"</tspan>: <tspan fill="#ff8a3d">94</tspan> },</text>
    <text x="640" y="222" fill="#8b93a7" xml:space="preserve">  { <tspan fill="#7fb0ff">"rank"</tspan>: <tspan fill="#ff8a3d">8</tspan>,  <tspan fill="#7fb0ff">"points"</tspan>: <tspan fill="#ff8a3d">143</tspan>, <tspan fill="#7fb0ff">"number_of_comments"</tspan>: <tspan fill="#ff8a3d">31</tspan> }</text>
    <text x="640" y="246" fill="#8b93a7">]</text>
    <rect x="652" y="258" width="8" height="14" fill="#ff6600" opacity="0.85"/>
  </g>
  <metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
